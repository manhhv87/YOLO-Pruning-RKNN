# CALM-Row detection dataset, synthesised from CRDLD line-masks by prepare_crdld.py.
# Boxes are placed on ALL crop rows (single class) at --n-boxes y-bands (default 8),
# perspective-scaled; the central navigation row is selected at EVAL time, not in training.
# Run first:
#   python prepare_crdld.py --root datasets/CRDLD --splits train validation test \
#     --out-images datasets/CRDLD_yolo/images --out-labels datasets/CRDLD_yolo/labels --n-boxes 8
path: CRDLD_yolo          # relative to the datasets/ root (Ultralytics resolves under settings 'datasets_dir')
train: images/train
val: images/val
test: images/test
nc: 1
names:
  0: crop_row
